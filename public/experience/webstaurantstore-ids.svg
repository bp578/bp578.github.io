<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8ef"/>
      <stop offset="1" stop-color="#dcefd7"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f3d0f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <image href="data:image/png;base64," x="70" y="52" width="84" height="84"/>
  <text x="176" y="92" font-size="38" font-weight="700" fill="#14431a">WebstaurantStore · IDS</text>
  <text x="176" y="128" font-size="24" fill="#3f6b44">Legacy ERP migration → React · TypeScript · .NET</text>

  <!-- Legacy ERP terminal -->
  <g filter="url(#sh)">
    <rect x="90" y="220" width="580" height="520" rx="18" fill="#161a16"/>
    <path d="M90 238a18 18 0 0 1 18-18h544a18 18 0 0 1 18 18v32H90z" fill="#2c322c"/>
  </g>
  <text x="114" y="252" font-family="Consolas, Menlo, monospace" font-size="18" fill="#9ab09a">IDS.EXE — ORDER ENTRY [LEGACY]</text>
  <g font-family="Consolas, Menlo, monospace" font-size="21" fill="#4ade4a">
    <text y="318"><tspan x="118">ORD#</tspan><tspan x="200">CUST</tspan><tspan x="316">SKU</tspan><tspan x="430">QTY</tspan><tspan x="488">STAT</tspan></text>
    <text fill="#2f8f2f" y="350"><tspan x="118">======</tspan><tspan x="200">=========</tspan><tspan x="316">========</tspan><tspan x="430">====</tspan><tspan x="488">====</tspan></text>
    <text y="384"><tspan x="118">104832</tspan><tspan x="200">RESTAURNT</tspan><tspan x="316">351PAN04</tspan><tspan x="430">12</tspan><tspan x="488">OPN</tspan></text>
    <text y="416"><tspan x="118">104833</tspan><tspan x="200">CAFE-INC</tspan><tspan x="316">922TRAY1</tspan><tspan x="430">40</tspan><tspan x="488">OPN</tspan></text>
    <text y="448"><tspan x="118">104834</tspan><tspan x="200">DINER-CO</tspan><tspan x="316">407LADLE</tspan><tspan x="430">06</tspan><tspan x="488">HLD</tspan></text>
    <text y="480"><tspan x="118">104835</tspan><tspan x="200">BISTRO-L</tspan><tspan x="316">133MIXR2</tspan><tspan x="430">02</tspan><tspan x="488">SHP</tspan></text>
    <text y="512"><tspan x="118">104836</tspan><tspan x="200">GRILL-HS</tspan><tspan x="316">610FRYR8</tspan><tspan x="430">01</tspan><tspan x="488">OPN</tspan></text>
    <text x="118" y="580">F1=HELP F3=EXIT F5=REFRESH F12=CANCEL</text>
    <text x="118" y="640">CMD ==&gt; </text>
    <rect x="228" y="622" width="14" height="24" fill="#4ade4a"/>
  </g>
  <text x="380" y="706" text-anchor="middle" font-size="20" font-weight="600" fill="#7c8a7c" letter-spacing="3">BEFORE</text>

  <!-- Migration arrow -->
  <g fill="#2a8c25">
    <rect x="700" y="452" width="130" height="36" rx="18"/>
    <path d="M818 418l70 52-70 52z"/>
  </g>
  <g font-size="17" font-weight="700" fill="#14431a" text-anchor="middle">
    <text x="790" y="410">5 FEATURES</text>
    <text x="790" y="540">MIGRATED</text>
  </g>

  <!-- Modern web app -->
  <g filter="url(#sh)">
    <rect x="920" y="190" width="600" height="580" rx="18" fill="#ffffff"/>
    <path d="M920 208a18 18 0 0 1 18-18h564a18 18 0 0 1 18 18v38H920z" fill="#eef2ee"/>
  </g>
  <circle cx="948" cy="218" r="7" fill="#f2655a"/>
  <circle cx="972" cy="218" r="7" fill="#f6bf4f"/>
  <circle cx="996" cy="218" r="7" fill="#5bc35b"/>
  <rect x="1026" y="206" width="300" height="24" rx="12" fill="#ffffff"/>
  <text x="1042" y="223" font-size="14" fill="#7c8a7c">ids.internal/orders</text>

  <!-- sidebar -->
  <rect x="920" y="246" width="150" height="524" fill="#14431a"/>
  <path d="M920 746h150v24H938a18 18 0 0 1-18-18z" fill="#14431a"/>
  <rect x="944" y="276" width="100" height="14" rx="7" fill="#7fd47a"/>
  <rect x="944" y="316" width="84" height="12" rx="6" fill="#3f7a45"/>
  <rect x="944" y="348" width="92" height="12" rx="6" fill="#3f7a45"/>
  <rect x="944" y="380" width="70" height="12" rx="6" fill="#3f7a45"/>
  <rect x="944" y="412" width="88" height="12" rx="6" fill="#3f7a45"/>

  <!-- content -->
  <text x="1100" y="292" font-size="26" font-weight="700" fill="#14431a">Orders</text>
  <rect x="1394" y="268" width="100" height="34" rx="10" fill="#2a8c25"/>
  <text x="1444" y="291" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">+ New</text>

  <g>
    <rect x="1100" y="322" width="120" height="78" rx="12" fill="#eef7ec"/>
    <text x="1116" y="352" font-size="14" fill="#5d7a60">Open</text>
    <text x="1116" y="384" font-size="26" font-weight="700" fill="#14431a">128</text>
    <rect x="1236" y="322" width="120" height="78" rx="12" fill="#eef7ec"/>
    <text x="1252" y="352" font-size="14" fill="#5d7a60">On hold</text>
    <text x="1252" y="384" font-size="26" font-weight="700" fill="#14431a">14</text>
    <rect x="1372" y="322" width="122" height="78" rx="12" fill="#eef7ec"/>
    <text x="1388" y="352" font-size="14" fill="#5d7a60">Shipped</text>
    <text x="1388" y="384" font-size="26" font-weight="700" fill="#14431a">912</text>
  </g>

  <g font-size="15">
    <rect x="1100" y="420" width="394" height="36" rx="8" fill="#f4f6f4"/>
    <text x="1116" y="444" font-weight="700" fill="#5d7a60">Order</text>
    <text x="1210" y="444" font-weight="700" fill="#5d7a60">Customer</text>
    <text x="1420" y="444" font-weight="700" fill="#5d7a60">Status</text>

    <text x="1116" y="490" fill="#223">#104832</text><text x="1210" y="490" fill="#223">Restaurant Co.</text>
    <rect x="1410" y="474" width="68" height="24" rx="12" fill="#dcf3d8"/><text x="1444" y="491" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a1a">Open</text>
    <line x1="1100" y1="510" x2="1494" y2="510" stroke="#e6ebe6"/>
    <text x="1116" y="540" fill="#223">#104833</text><text x="1210" y="540" fill="#223">Cafe Inc.</text>
    <rect x="1410" y="524" width="68" height="24" rx="12" fill="#dcf3d8"/><text x="1444" y="541" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a1a">Open</text>
    <line x1="1100" y1="560" x2="1494" y2="560" stroke="#e6ebe6"/>
    <text x="1116" y="590" fill="#223">#104834</text><text x="1210" y="590" fill="#223">Diner &amp; Co.</text>
    <rect x="1410" y="574" width="68" height="24" rx="12" fill="#fdeccb"/><text x="1444" y="591" text-anchor="middle" font-size="13" font-weight="600" fill="#9a6206">Hold</text>
    <line x1="1100" y1="610" x2="1494" y2="610" stroke="#e6ebe6"/>
    <text x="1116" y="640" fill="#223">#104835</text><text x="1210" y="640" fill="#223">Bistro Lane</text>
    <rect x="1404" y="624" width="80" height="24" rx="12" fill="#dde6f7"/><text x="1444" y="641" text-anchor="middle" font-size="13" font-weight="600" fill="#2b4f9a">Shipped</text>
  </g>

  <!-- stack chips -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="1100" y="692" width="100" height="34" rx="17" fill="#e3f6fb"/><text x="1150" y="715" fill="#0b7a96">React</text>
    <rect x="1212" y="692" width="128" height="34" rx="17" fill="#e4edfb"/><text x="1276" y="715" fill="#2f5fb3">TypeScript</text>
    <rect x="1352" y="692" width="80" height="34" rx="17" fill="#ece6fb"/><text x="1392" y="715" fill="#5b3bb5">.NET</text>
  </g>
  <text x="1220" y="808" text-anchor="middle" font-size="20" font-weight="600" fill="#2a8c25" letter-spacing="3">AFTER</text>
</svg>
