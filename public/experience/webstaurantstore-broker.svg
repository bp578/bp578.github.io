    <text x="146" y="290"><tspan fill="#c586c0">@inject</tspan><tspan fill="#4ec9b0"> IBrokerApi</tspan><tspan fill="#9cdcfe"> Api</tspan></text>
    <text x="146" y="354"><tspan fill="#808080">&lt;</tspan><tspan fill="#4ec9b0">ThreadHeader</tspan><tspan fill="#9cdcfe"> Title</tspan><tspan fill="#d4d4d4">=</tspan><tspan fill="#ce9178">"@Thread.Name"</tspan><tspan fill="#808080"> /&gt;</tspan></text>
    <text x="146" y="386"><tspan fill="#808080">&lt;</tspan><tspan fill="#569cd6">ul</tspan><tspan fill="#9cdcfe"> class</tspan><tspan fill="#d4d4d4">=</tspan><tspan fill="#ce9178">"messages"</tspan><tspan fill="#808080">&gt;</tspan></text>
    <text x="170" y="418"><tspan fill="#c586c0">@foreach</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#569cd6">var</tspan><tspan fill="#9cdcfe"> msg </tspan><tspan fill="#c586c0">in</tspan><tspan fill="#9cdcfe"> Messages</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <text x="170" y="450" fill="#d4d4d4">{</text>
    <text x="194" y="482"><tspan fill="#808080">&lt;</tspan><tspan fill="#4ec9b0">MessageBubble</tspan><tspan fill="#9cdcfe"> Message</tspan><tspan fill="#d4d4d4">=</tspan><tspan fill="#ce9178">"msg"</tspan><tspan fill="#808080"> /&gt;</tspan></text>
    <text x="170" y="514" fill="#d4d4d4">}</text>
    <text x="146" y="546"><tspan fill="#808080">&lt;/</tspan><tspan fill="#569cd6">ul</tspan><tspan fill="#808080">&gt;</tspan></text>
    <text x="146" y="578"><tspan fill="#808080">&lt;</tspan><tspan fill="#4ec9b0">Composer</tspan><tspan fill="#9cdcfe"> OnSend</tspan><tspan fill="#d4d4d4">=</tspan><tspan fill="#ce9178">"SendAsync"</tspan><tspan fill="#808080"> /&gt;</tspan></text>
    <text x="146" y="642"><tspan fill="#c586c0">@code</tspan><tspan fill="#d4d4d4"> {</tspan></text>
    <text x="170" y="674"><tspan fill="#569cd6">async</tspan><tspan fill="#4ec9b0"> Task</tspan><tspan fill="#dcdcaa"> SendAsync</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#569cd6">string</tspan><tspan fill="#9cdcfe"> text</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <text x="194" y="706"><tspan fill="#d4d4d4">=&gt; </tspan><tspan fill="#c586c0">await</tspan><tspan fill="#9cdcfe"> Api</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">PostMessage</tspan><tspan fill="#d4d4d4">(Thread.Id, text);</tspan></text>
    <text x="146" y="738" fill="#d4d4d4">}</text>
    <rect x="160" y="752" width="11" height="24" fill="#aeafad"/>
  </g>

